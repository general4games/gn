<html lang="ar" manifest="cache.manifest" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustafa PS4/PS5</title>
    <link rel="stylesheet" href="includes/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&amp;display=swap" rel="stylesheet">
    <script>
        if (window.applicationCache && window.applicationCache.status == 0) {
            window.location.replace("cache.html");
        }
    </script>
</head>
<body>

    <div class="container">

        <header>
            <h1>الجنرال للالعاب الالكترونيه <span>--درنه شارع الرفاعي</span></h1>
            <p class="sub">تصميم طه بن فايد</p>
            <div class="blue-line"></div>
        </header>

        <div class="card">

            <div class="status">
                <span class="dot waiting" id="statusDot"></span>
                <span id="statusText">تغيير: netctrl</span>
                <span class="ver">v3.0</span>
            </div>

            <div class="device">
                <span id="UA">الجهاز: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36</span>
            </div>

            <div class="options">

                <div class="kernel">
                    <span>الثغرة:</span>
                    <form id="kernel-options">
                        <label>
                            <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
                            <span>NetCtrl</span>
                        </label>
                        <label>
                            <input type="radio" name="kernel" id="lapse-exploit" value="lapse" checked="">
                            <span>Lapse</span>
                        </label>
                    </form>
                </div>

                <button id="jeilbrek" class="btn-gold">
                    تشغيل الاختراق
                </button>

                <div class="auto">
                    <label for="autoJbInput" id="autoJbLabel">تلقائي</label>
                    <input id="autoJbInput" type="checkbox">
                </div>

            </div>

            <div class="content">
                <div class="image">
                    <img src="includes/cat.jpg" alt="Mustafa" onerror="this.style.display='none'">
                    <span>Mustafa Edition</span>
                </div>
                <pre id="console">Mustafa PS4/PS5 جاهز...
انتظر التنفيذ...</pre>
            </div>

            <footer>
                <span>Mustafa</span>
                <span>|</span>
                <span>PS4/PS5 Golden</span>
            </footer>

        </div>

    </div>

    <script src="src/main.js"></script>
    <script src="includes/script.js"></script>

</body></html>
